  --ink:#172b3a; --muted:#5e6b73; --paper:#f7f5ef; --white:#fff;

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;

  font-family:'Inter', sans-serif;

}

.wrap{width:min(1120px, calc(100% - 40px));margin:auto}

/* Header mượt mà */
header{
  position:sticky;

  z-index:100;
  background:rgba(247,245,239,.9);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  transition: all 0.3s ease;
}

nav{display:flex;gap:26px;align-items:center}
nav a{text-decoration:none;font-size:.9rem;font-weight:500;color:var(--muted);transition:color 0.25s ease}
nav a:hover{color:var(--teal)}
.menu{display:none;background:none;border:1px solid var(--line);border-radius:8px;padding:8px 12px;color:var(--ink);cursor:pointer}
